<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AHMED ZAKARIA | مصمم مواقع 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter+Tight:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060f;--fg:#eef0ff;--mut:#9aa0c8;--card:rgba(20,22,48,.62);--bd:rgba(130,140,255,.22);--a:#7c5cff;--b:#00e5ff;--wa:#25d366;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05060f;--fg:#eef0ff;--mut:#9aa0c8}}
:root[data-theme="dark"]{--bg:#05060f;--fg:#eef0ff;--mut:#9aa0c8}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'Cairo','Segoe UI',Tahoma,sans-serif;line-height:1.8;overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
a{color:inherit;text-decoration:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4vw;background:rgba(5,6,15,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.brand{font:900 1.25rem 'Inter Tight',sans-serif;letter-spacing:.08em;background:linear-gradient(120deg,var(--b),var(--a),#ff4fd8);-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}
nav{display:flex;gap:6px}
nav a{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:30px;font-weight:700;font-size:.95rem;color:var(--mut);transition:.25s}
nav a:hover,nav a.on{color:#fff;background:rgba(124,92,255,.25);box-shadow:0 0 0 1px var(--bd) inset}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 30px;border-radius:50px;font-weight:800;font-size:1.05rem;border:1px solid var(--bd);background:var(--card);color:#fff;cursor:pointer;transition:transform .3s,box-shadow .3s;font-family:inherit}
.btn:hover{transform:translateY(-4px) scale(1.04)}
.btn.wa{background:linear-gradient(120deg,#25d366,#128c7e);border:0;box-shadow:0 10px 36px rgba(37,211,102,.38)}
.btn.wa:hover{box-shadow:0 16px 50px rgba(37,211,102,.6)}
.btn.pr{background:linear-gradient(120deg,var(--a),#4f8cff);border:0;box-shadow:0 10px 36px rgba(124,92,255,.4)}
main{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:40px 5vw 120px;min-height:80vh}
.view{animation:in .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
h1{font:900 clamp(2.6rem,9vw,6rem)/1.1 'Inter Tight',sans-serif;direction:ltr;text-align:right;background:linear-gradient(120deg,var(--b),var(--a),#ff4fd8);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 70px rgba(124,92,255,.3)}
h2{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:900;margin-bottom:8px}
.lead{color:var(--mut);font-size:clamp(1rem,2.4vw,1.25rem);max-width:640px;margin:14px 0 26px}
.eyebrow{display:inline-flex;gap:8px;align-items:center;padding:6px 16px;border-radius:30px;border:1px solid var(--bd);background:var(--card);color:var(--b);font-weight:700;font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;align-items:center;min-height:68vh}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-top:30px}
.stat{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--bd);text-align:center}
.stat b{display:block;font-size:1.5rem;color:var(--b);font-weight:900}
.stat span{color:var(--mut);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px;margin-top:28px;perspective:1100px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.4);transition:transform .18s ease-out,box-shadow .3s;transform-style:preserve-3d}
.card:hover{box-shadow:0 30px 80px rgba(124,92,255,.32)}
.card h3{font-size:1.2rem;margin:10px 0 4px;font-weight:800}
.card p{color:var(--mut);font-size:.95rem}
.sic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 10px 30px rgba(124,92,255,.45)}
.sic .ic{width:28px;height:28px;color:#fff}
.work{padding:0;overflow:hidden;display:block}
.work .mk{display:block;width:100%;height:auto}
.work .in{padding:18px 22px 22px}
.tagp{display:inline-block;padding:2px 12px;border-radius:20px;background:rgba(0,229,255,.12);color:var(--b);font-size:.8rem;font-weight:700}
.reel{position:relative;perspective:1200px}
.dev{position:relative;border-radius:22px;padding:10px;background:linear-gradient(145deg,#2a2e5c,#0d0f26);box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 80px rgba(124,92,255,.3);transform-style:preserve-3d;transition:transform .2s ease-out}
.dev .sl{position:absolute;inset:10px;opacity:0;transition:opacity .8s,transform .8s;transform:scale(1.06)}
.dev .sl.on{opacity:1;transform:none}
.dev .sz{width:100%;aspect-ratio:640/400}
.dev .mk{width:100%;height:100%;display:block}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b),var(--a))}
.rcap{display:flex;justify-content:space-between;color:var(--mut);font-size:.85rem;margin-top:8px}
.big{padding:34px}
.price{font:900 clamp(3rem,11vw,6rem)/1 'Inter Tight',sans-serif;color:var(--b);text-shadow:0 0 50px rgba(0,229,255,.5)}
ul.ck{list-style:none;margin:16px 0}
ul.ck li{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--bd)}
ul.ck .ic{color:var(--wa)}
.steps{counter-reset:s}
.steps .card::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));font-weight:900;margin-bottom:8px}
.avatar{width:120px;height:120px;border-radius:50%;object-fit:cover;background:#fff;border:3px solid var(--b);box-shadow:0 0 0 6px rgba(0,229,255,.12),0 20px 50px rgba(0,0,0,.5);image-rendering:auto}
form{display:grid;gap:12px;margin-top:16px}
input,select,textarea{font:inherit;color:#fff;background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--b)}
select option{color:#000}
.crumb{display:flex;gap:8px;color:var(--mut);margin-bottom:18px;font-size:.9rem}
.crumb a:hover{color:var(--b)}
.det{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:start}
footer{position:relative;z-index:2;border-top:1px solid var(--bd);padding:28px 5vw 110px;text-align:center;color:var(--mut);background:rgba(5,6,15,.6)}
footer .row{justify-content:center;margin-bottom:12px}
.soc{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--bd);background:var(--card);transition:.3s}
.soc:hover{transform:translateY(-4px) rotate(-6deg);background:var(--a)}
@media (max-width:860px){
 .hero,.det{grid-template-columns:1fr}
 h1{text-align:center}.hero>div:first-child{text-align:center}.row{justify-content:center}
 nav{position:fixed;inset:auto 0 0 0;justify-content:space-around;gap:0;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(8,9,24,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--bd);z-index:70}
 nav a{flex-direction:column;gap:2px;padding:6px 10px;font-size:.72rem;border-radius:14px}
 header .wa{display:none}
 main{padding-bottom:130px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- الراوتر ---------- */
var main=$('main'),reelT=null,tg={x:2.2,y:0,s:1,r:0};
var T={home:{x:2.4,y:0,s:1},services:{x:3.2,y:1,s:.7},works:{x:-3.2,y:1,s:.7},pricing:{x:3.2,y:-1,s:.8},about:{x:-3.2,y:-1,s:.7},contact:{x:0,y:2.6,s:.6}};
function route(){
 var h=(location.hash||'#home').slice(1),m=/^work([1-6])$/.exec(h),v=m?'works':(views[h]?h:'home');
 main.innerHTML='<div class="view">'+(m?workView(+m[1]):views[v]())+'</div>';
 document.querySelectorAll('#nav a').forEach(function(a){a.classList.toggle('on',a.dataset.n===v)});
 tg=T[v];scrollTo(0,0);clearInterval(reelT);
 if(v==='home'&&!m)reel();
 if(v==='contact')$('cf').addEventListener('submit',function(e){e.preventDefault();window.open(wa('أهلاً أحمد، أنا '+$('cn').value+'. عايز: '+$('ct').value+'. '+$('cm').value),'_blank','noopener')});
}
function reel(){
 var sl=document.querySelectorAll('.dev .sl'),i=0,t0=Date.now(),D=3500;
 reelT=setInterval(function(){var e=Date.now()-t0;if(e>=D){t0=Date.now();e=0;sl[i].classList.remove('on');i=(i+1)%sl.length;sl[i].classList.add('on');$('rt').textContent=W[i][0]}var p=$('pg');if(p)p.style.width=(e/D*100)+'%'},50);
}
addEventListener('hashchange',route);
document.addEventListener('mousemove',function(e){var c=e.target.closest&&e.target.closest('.tilt,.dev');if(!c)return;var b=c.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;c.style.transform='rotateY('+(x*-14)+'deg) rotateX('+(y*14)+'deg) scale(1.02)'});
document.addEventListener('mouseout',function(e){var c=e.target.closest&&e.target.closest('.tilt,.dev');if(c)c.style.transform=''});
route();

/* ---------- مشهد 3D ---------- */
try{
 var cv=$('bg'),r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
 r.setPixelRatio(Math.min(devicePixelRatio||1,3));
 var sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(55,1,.1,200);cam.position.z=10;
 sc.add(new THREE.AmbientLight(0x6666ff,.7));
 var l1=new THREE.PointLight(0x00e5ff,2.4,60);l1.position.set(8,6,8);sc.add(l1);
 var l2=new THREE.PointLight(0xff4fd8,2.4,60);l2.position.set(-8,-5,6);sc.add(l2);
 var g=new THREE.Group();sc.add(g);
 var kn=new THREE.Mesh(new THREE.TorusKnotGeometry(1.7,.5,300,48),new THREE.MeshStandardMaterial({color:0x7c5cff,metalness:.9,roughness:.2}));g.add(kn);
 var wf=new THREE.Mesh(new THREE.IcosahedronGeometry(3.6,1),new THREE.MeshBasicMaterial({color:0x00e5ff,wireframe:true,transparent:true,opacity:.16}));g.add(wf);
 var sh=[],i;
 for(i=0;i<16;i++){var m=new THREE.Mesh(i%2?new THREE.OctahedronGeometry(.45):new THREE.BoxGeometry(.6,.6,.6),new THREE.MeshStandardMaterial({color:i%3?0x00e5ff:0xff4fd8,metalness:.8,roughness:.25}));m.position.set((Math.random()-.5)*28,(Math.random()-.5)*20,(Math.random()-.5)*14-4);m.userData.s=Math.random()*.01+.003;sc.add(m);sh.push(m)}
 var n=1600,pa=new Float32Array(n*3);for(i=0;i<n*3;i++)pa[i]=(Math.random()-.5)*64;
 var pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pa,3));
 var pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0x9aa0ff,size:.06,transparent:true,opacity:.8}));sc.add(pts);
 var rs=function(){r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()};rs();addEventListener('resize',rs);
 var mx=0,my=0,t=0;addEventListener('mousemove',function(e){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
 (function loop(){requestAnimationFrame(loop);t+=.01;
  var k=innerWidth<860?0:1;
  g.position.x+=((tg.x*k)-g.position.x)*.05;g.position.y+=((tg.y+(k?0:2.2))-g.position.y)*.05;
  var s=g.scale.x+((tg.s*(k?1:.8))-g.scale.x)*.05;g.scale.setScalar(s);
  kn.rotation.x=t*.6;kn.rotation.y=t*.8;wf.rotation.y=-t*.3;wf.rotation.x=t*.2;
  sh.forEach(function(o){o.rotation.x+=o.userData.s*2;o.rotation.y+=o.userData.s*3;o.position.y+=Math.sin(t+o.position.x)*.004});
  pts.rotation.y=t*.03;cam.position.x+=(mx*3-cam.position.x)*.05;cam.position.y+=(-my*2-cam.position.y)*.05;cam.lookAt(0,0,0);r.render(sc,cam)})();
}catch(e){console.error(e)}
})();
</script>
